<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7ec8ff">
  <title>Page not found — Gopinath Gurusamy</title>
  <script>
    // Resolve the Pages project base before requesting any relative assets.
    // Creating the asset elements here avoids speculative requests from deep URLs.
    if (location.pathname.startsWith('/gopinath-portfolio/')) {
      const base = document.createElement('base');
      base.href = '/gopinath-portfolio/';
      document.head.append(base);
    }
    const icon = document.createElement('link');
    icon.rel = 'icon';
    icon.type = 'image/svg+xml';
    icon.href = 'favicon.svg';
    document.head.append(icon);
    const stylesheet = document.createElement('link');
    stylesheet.rel = 'stylesheet';
    stylesheet.href = 'assets/css/styles.css?v=11';
    document.head.append(stylesheet);
    document.addEventListener('DOMContentLoaded', () => {
      if (location.pathname.startsWith('/gopinath-portfolio/')) {
        document.querySelector('.skip-link').href = location.pathname + '#main';
      }
      const script = document.createElement('script');
      script.src = 'assets/js/main.js?v=11';
      document.head.append(script);
    });
  </script>
  <noscript><link rel="icon" href="favicon.svg" type="image/svg+xml"> <link rel="stylesheet" href="assets/css/styles.css?v=11"></noscript>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead"><div class="masthead-row page-width"><a class="wordmark" href="./" aria-label="Gopinath Gurusamy, home">g<span class="accent" aria-hidden="true">.</span> <span class="wordmark-name">Gopinath Gurusamy</span></a> <button class="theme-toggle" type="button" aria-label="Switch colour theme" aria-pressed="false" hidden>◐</button></div></header>
  <main class="page-width error-page" id="main" tabindex="-1"><span class="error-record">Page not found</span> <h1>Record not found.<br> Let’s reconnect.</h1> <p>This page doesn’t exist. Return to the portfolio for career records, selected solutions and contact details.</p> <a class="solid-link" href="./">Back to portfolio <span aria-hidden="true">↗</span></a></main>
</body>
</html>
