  <title>Page not found — Gopinath Gurusamy</title>
  <script>
    // Resolve relative assets even when GitHub Pages serves this at a nested URL.
    if (location.pathname.startsWith('/gopinath-portfolio/')) {
      const base = document.createElement('base');
      base.href = '/gopinath-portfolio/';
      document.head.append(base);
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('.skip-link').href = location.pathname + '#main';
      });
    }
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css?v=7">

</head>

  <main class="wrap error-page" id="main" tabindex="-1"><span class="eyebrow">404 / Page not found</span><h1>Let’s get you<br> back on track.</h1> <p>This page doesn’t exist. Head back to the portfolio to explore my work or get in touch.</p> <a class="button button-primary" href="./">Back to portfolio <span aria-hidden="true">↗</span></a></main>
